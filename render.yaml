services:
  - type: web
    name: prospector-portfolio
    runtime: node
    plan: free
    rootDir: deploy
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
